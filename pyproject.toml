[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mtrs-sdibca-toolkit"
version = "1.4.2"
description = "Reference implementation of transport scenario ranking stability (MTRS) and staged-delay benefit-cost analysis (SDI-BCA)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["transport", "policy-analysis", "ranking-stability", "benefit-cost-analysis", "uncertainty"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/Yanxi-Liu-Research/mtrs-toolkit"
Documentation = "https://github.com/Yanxi-Liu-Research/mtrs-toolkit#readme"
Repository = "https://github.com/Yanxi-Liu-Research/mtrs-toolkit"

[tool.setuptools]
packages = ["mtrs", "sdibca"]
